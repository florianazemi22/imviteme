# Static marketing page.
#
# The headers below mirror what the production host must send, so that a
# header mistake shows up locally rather than after launch. The CSP matches
# landing/README.md: the page has no inline script and no inline style, so it
# needs no 'unsafe-inline' anywhere.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed asset names do not exist here yet, so keep the HTML uncached and
    # the assets short-lived.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(css|js|svg|png|webp|avif|woff2)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
