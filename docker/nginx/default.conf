# nginx -> php-fpm for the Symfony application.

server {
    listen 80 default_server;
    server_name _;

    root /app/public;

    # Symfony's single front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # OG crawlers and slow mobile clients both benefit from a generous
        # read timeout on the render path.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Anything else ending in .php is an attempt to execute an uploaded file.
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 24m;

    # Public invitation pages are cached at the CDN, not here; see
    # docs/architecture/07-link-previews.md §7.2 for the real cache policy.
    access_log /dev/stdout;
    error_log  /dev/stderr;
}
