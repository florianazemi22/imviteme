; Development defaults. Production overrides these — notably opcache
; validate_timestamps=0 and display_errors=Off.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60

; Guest photo uploads arrive in batches; a wedding gallery is up to 40 images.
max_file_uploads = 50

display_errors = On
error_reporting = E_ALL

; UTC everywhere. Invitations carry their own IANA zone in the database
; (docs/architecture/01-data-model.md §1.3); the PHP process must never
; impose a local one.
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
