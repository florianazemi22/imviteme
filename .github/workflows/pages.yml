# Publishes landing/ to GitHub Pages.
#
# configure-pages runs with enablement: true, so the first successful run turns
# Pages on by itself — no manual toggle in Settings, provided the workflow has
# the `pages: write` permission below.
#
# The branch filter names the repository's current default branch explicitly.
# Pages will only deploy from the default branch, so if this repo ever gains a
# `main` and switches to it, update the branch here too.

name: Deploy landing page

on:
  push:
    branches: [claude/imvite-architecture-planning-kehpko]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload landing/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
