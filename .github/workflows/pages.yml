# Publishes landing/ to GitHub Pages.
#
# ONE-TIME MANUAL STEP, required before this can succeed:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# It cannot be automated from here. Creating a Pages site is an admin-level
# operation and the workflow's GITHUB_TOKEN is refused with "Resource not
# accessible by integration", whatever permissions the job requests. Running
# configure-pages with `enablement: true` fails for the same reason.
#
# Once the source is set to GitHub Actions, every push that touches landing/
# redeploys the site automatically.
#
# The branch filter names the repository's current default branch explicitly.
# Pages will only deploy from the default branch, so if this repo ever gains a
# `main` and switches to it, update the branch here too.

name: Deploy landing page

on:
  push:
    branches: [claude/imvite-architecture-planning-kehpko]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
